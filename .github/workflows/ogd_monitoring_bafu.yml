name: OGD Monitoring BAFU

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"  # täglich 06:15 UTC

permissions:
  contents: write

jobs:
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitoring ausführen
        run: python OGD_Monitoring_BAFU.py

      - name: Daten committen und pushen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data/ plots/
          git diff --staged --quiet || git commit -m "chore: Monitoring update $(date -u +%Y-%m-%d)"
          git push
